<head>
<meta charset="UTF-8">

<title>Virtual Lab — IGCSE Sciences &amp; ICT</title>
<meta name="description" content="Interactive IGCSE practicals for Physics, Chemistry, Biology and ICT: run experiments, record results, plot graphs and check your understanding.">

<script>
(function(){
  try{
    var m = localStorage.getItem('datalab-mode');
    if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-mode', m);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="lab.css">
